name: Release & Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release & Publish (Ubuntu 24.04 / Node 22)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22 & npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Verify Git Tag matches package.json version
        id: meta
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./packages/vibedock/package.json').version")"
          echo "Tag version: ${TAG_VERSION}, package.json version: ${PKG_VERSION}"
          if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
            echo "::error::Git tag (${GITHUB_REF_NAME}) does not match packages/vibedock/package.json version (${PKG_VERSION})"
            exit 1
          fi
          echo "version=${PKG_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check, build, and test
        run: |
          pnpm check
          pnpm test

      - name: Pack release tarball
        run: pnpm --filter vibedock pack --pack-destination .

      - name: Publish to npmjs.org
        run: pnpm --filter vibedock publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "VibeDock v${{ steps.meta.outputs.version }}"
          generate_release_notes: true
          files: vibedock-${{ steps.meta.outputs.version }}.tgz
          body: |
            ### 📦 快速安装 / 升级 (Quick Install)

            ```bash
            # 全局安装或升级 CLI
            npm install -g vibedock@${{ steps.meta.outputs.version }}

            # Ubuntu 24.04 裸机一键部署生产底座
            sudo vibedock setup
            vibedock init
            vibedock start --daemon
            ```
